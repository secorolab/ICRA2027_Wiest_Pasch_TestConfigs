scenario_file: scenario.osc
metadata:
  name: experiment_qd_follow_waypoints_hexagon
  title: QD Nav2 behavior-tree coverage search -- follow waypoints -- tb3_world
  description: 'Quality-diversity search over map-constrained start/goal paths, static
    obstacle count and

    lateral placement, dynamic obstacle trigger/lateral placement, controller profile,
    fixed Navfn

    planner, and GridBased.use_astar. MPPI and DWB are the controller profiles. FollowWaypoints
    drives NavigateToPose

    for each waypoint, so the QD objective uses navigate_to_pose_w_replanning_and_recovery.xml.


    The room is the ROS 2 `turtlebot3_world` (roqsim_scenes:tb3_world): a hexagonal
    room 5.080 m

    flat-to-flat inside its wall, with nine columns of r = 0.15 m on a 3x3 grid at
    1.1 m spacing. Its

    occupancy grid is projected from that scene, so the map and the world hold the
    same obstacles. The

    world resolves from the installed scene package rather than from run_files, so
    the campaign image

    must carry a roqsim that has it.

    '
