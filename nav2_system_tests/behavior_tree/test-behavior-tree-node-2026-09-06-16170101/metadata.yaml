scenario_file: scenario.osc
metadata:
  name: test_behavior_tree_node
  title: Nav2 behavior-tree recovery, TurtleBot 4 + Nav2, in roqsim (MuJoCo)
  creators:
  - name: Wiest, Samuel
    identifiers: 0009-0002-9215-1238
  - name: Ortega Sainz, Argentina
    identifiers: 0000-0002-3873-4435
  - name: Pasch, Frederik
    identifiers: 0000-0002-2626-1538
  version: 1.0.0
  license: CC-BY-4.0
  keywords:
  - robotics
  - navigation
  - ROS2
  - mujoco
  - roqsim
  - nav2
  - turtlebot4
  - behavior-tree
  - recovery
  description: "Replication of nav2's behavior-tree system test\n(nav2_system_tests/src/behavior_tree/test_behavior_tree_node.cpp,\
    \ main;\nnav2_system_tests.csv lines 2-8). Where upstream runs an in-process gtest\
    \ -- a\nBehaviorTreeFactory plus DUMMY action servers (ComputePathToPose, FollowPath,\
    \ Spin,\nWait, BackUp) with injectable failure/running ranges, ticked by hand\
    \ -- this campaign\nruns the REAL nav2 stack (bt_navigator + planner + controller\
    \ + behavior_server) with\nthe stock recovery tree `navigate_to_pose_w_replanning_and_recovery.xml`\
    \ and drives a\nreal NavigateToPose goal. The tree's execution is recorded through\
    \ /behavior_tree_log\nand analysed for behavior-tree coverage.\n\nMEANING OF A\
    \ CELL: one configuration is the runtime analog of one upstream gtest\ncase. The\
    \ blackbox scenario cannot inject per-node failure ranges or tick the tree\nmanually,\
    \ so only the two END-TO-END outcomes upstream produces are ported:\n\n- bt-all-success\
    \  <- TestAllSuccess: a REACHABLE goal (0.0, 2.0). The recovery\n  tree's PipelineSequence\
    \ (ComputePathToPose + FollowPath) succeeds and the tree\n  returns SUCCESS. expect_success:\
    \ true.\n- bt-all-failure  <- TestAllFailure: an UNREACHABLE goal (10.0, 10.0,\
    \ outside the\n  map). ComputePathToPose fails, NavigateRecovery fires the recovery\
    \ subtree\n  (GoalUpdated -> RoundRobin: ClearingActions, Spin, Wait, BackUp),\
    \ the retries\n  exhaust, and the tree returns FAILURE. expect_success: false.\
    \ This is the case\n  that ELICITS the recovery nodes -- the BT-coverage cells\
    \ show Spin/Wait/BackUp\n  actually ticking, which a successful run never reaches.\n\
    \nNOT PORTED (whitebox/unit -- see readme.md): the XML-parse and ID-extraction\
    \ tests\n(TestBTXMLFiles, TestWrongBTFormatXML, TestExtractBehaviorTreeID, the\
    \ duplicate-ID /\nunique-ID registration tests, TestSkipFilesWithMissingID), which\
    \ need in-process\nfactory parsing with no robot involved, and the dummy-server\
    \ recovery-LOGIC tests\n(TestNavigateSubtreeRecoveries, TestNavigateRecoverySimple,\
    \ TestNavigateRecoveryComplex,\nTestRecoverySubtreeGoalUpdated), which inject\
    \ per-server failure/running ranges and\nmid-tick goal updates that a blackbox\
    \ scenario cannot express. Their recovery\nBEHAVIOUR is the observable bt-all-failure\
    \ surfaces.\n\nGRADING: the scenario emits `end` only when the navigate action\
    \ reports\nSTATUS_SUCCEEDED, so bt-all-success passes and bt-all-failure fails\
    \ (the expected\nupstream verdicts). Behavior-tree coverage is measured per run\
    \ by\nsearch/bt_coverage.py:BtCoverage against ground truth and summarised in\
    \ the\nanalysis_run.ipynb \"Behavior-tree nodes and coverage\" cells. BtCoverage's\
    \ goal_x/goal_y\nare set to the SUCCESS goal (0.0, 2.0); the bt-all-failure run's\
    \ `arrived` is 0 by\ndesign (its outcome is the tree FAILURE, not arrival).\n"
  agents:
  - id: turtlebot4
    configuration_files:
    - files/nav2_stack.launch.py
    - files/nav2_params.yaml
    derived_from: https://github.com/turtlebot/turtlebot4/tree/jazzy
    ros_distro: jazzy
  - id: simulation
    configuration_files:
    - world/nav2.yaml
    derived_from: https://github.com/cps-test-lab/roqsim
    ros_distro: jazzy
