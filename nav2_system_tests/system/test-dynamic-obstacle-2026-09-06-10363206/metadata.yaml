scenario_file: scenario.osc
metadata:
  name: test_dynamic_obstacle
  title: Static obstacle navigation, TurtleBot 4 + Nav2, in roqsim (MuJoCo)
  creators:
  - name: Wiest, Samuel
    identifiers: 0009-0002-9215-1238
  - name: Ortega Sainz, Argentina
    identifiers: 0000-0002-3873-4435
  - name: Pasch, Frederik
    identifiers: 0000-0002-2626-1538
  version: 1.0.0
  license: CC-BY-4.0
  keywords:
  - robotics
  - navigation
  - ROS2
  - mujoco
  - roqsim
  - nav2
  - turtlebot4
  - obstacle
  description: 'Replication of nav2''s test_dynamic_obstacle: a static cardboard box
    placed in the

    direct path forces the planner to replan around it. Uses DWB controller and Navfn

    planner with A* disabled, matching the upstream system test configuration.

    '
  agents:
  - id: turtlebot4
    configuration_files:
    - files/nav2_stack.launch.py
    - files/nav2_params.yaml
    derived_from: https://github.com/turtlebot/turtlebot4/tree/jazzy
    ros_distro: jazzy
  - id: simulation
    configuration_files:
    - world/nav2.yaml
    derived_from: https://github.com/cps-test-lab/roqsim
    ros_distro: jazzy
configurations:
- name: mt-hexagon-obstacle
  config:
    params_file: mt-hexagon-obstacle/_config/files/nav2_params.yaml
    map_file: _config/environments/hexagon/maps/hexagon.yaml
    mesh_file: _config/environments/hexagon/3d-mesh/hexagon.stl
    start_pose:
      position:
        x: -2.0
        y: -0.5
    goal_pose:
      position:
        x: 0.0
        y: 2.0
  sut: {}
  sim:
    config: world/nav2.yaml
    overrides:
      components:
        floorplan:
          mesh: /config/environments/hexagon/3d-mesh/hexagon.stl
        static_obstacles:
          instances:
          - pos:
            - -1.0
            - 0.75
            size:
            - 0.5
            - 0.4
            - 0.3
  config_files:
