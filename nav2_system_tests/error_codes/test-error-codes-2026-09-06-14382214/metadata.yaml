scenario_file: scenario.osc
metadata:
  name: test_error_codes
  title: Nav2 server error codes via stock plugins, TurtleBot 4 + Nav2, in roqsim
    (MuJoCo)
  creators:
  - name: Wiest, Samuel
    identifiers: 0009-0002-9215-1238
  - name: Ortega Sainz, Argentina
    identifiers: 0000-0002-3873-4435
  - name: Pasch, Frederik
    identifiers: 0000-0002-2626-1538
  version: 1.0.0
  license: CC-BY-4.0
  keywords:
  - robotics
  - navigation
  - ROS2
  - mujoco
  - roqsim
  - nav2
  - turtlebot4
  - error
  - failure
  description: "Reinterpretation of nav2's error_codes system test\n(nav2_system_tests/src/error_codes,\
    \ jazzy). Where upstream launches only\ncontroller_server, planner_server and\
    \ smoother_server with custom C++ error-code\nplugins, this campaign runs the\
    \ full nav2 stack (files/nav2_stack.launch.py, the\nsame world as the sibling\
    \ system_failure/test_failure_navigator.vast) and triggers\nSTOCK error codes\
    \ that nav2 emits without any custom plugin: requesting a\nnon-existent controller/planner/smoother\
    \ plugin id, or sending a goal the server\nrejects for a stock reason.\n\nMEANING\
    \ OF A CELL: one configuration is one upstream error-code test case\n(error_codes.csv\
    \ lines 32-37). The trial is a single direct action-call that the\nserver ABORTS\
    \ with the error code in result.error_code, so action_call returns\nFAILURE and\
    \ every cell carries expect_success: false. The analysis verifies the\nspecific\
    \ error_code from the recorded /<action>/_action/status messages (which\ncontain\
    \ result.error_code). expect_success being inverted is a graded-with correct\n\
    fact, not a broken campaign -- see scenario_nav2_behavior_test.osc's header for\
    \ the\nsame mechanism.\n\nPORTED CASE -> ERROR CODE:\n- FollowPath (CSV line 32)\
    \  -> controller_id that no plugin matches -> INVALID_CONTROLLER (stock)\n- ComputePathToPose\
    \ success/cancel (lines 33-34) -> planner_id that no plugin matches -> INVALID_PLANNER\
    \ (stock)\n- ComputePathThroughPoses success/cancel (lines 35-36) -> empty goals\
    \ -> NO_VIAPOINTS_GIVEN (stock)\n- SmoothPath (line 37)      -> smoother_id that\
    \ no plugin matches -> INVALID_SMOOTHER (stock)\n\nNOT PORTED, each because the\
    \ substrate cannot express it today -- recorded rather\nthan faked (see readme.md\
    \ for the full list and reasons):\n- The two CANCEL cases (lines 34 and 36). action_call\
    \ (the ONLY way to drive an\n  action in this scenario framework, which has no\
    \ FollowPath/ComputePath* typed\n  actions) has no cancel entry point; RosActionCall.shutdown()\
    \ cancels only at\n  scenario teardown.\n- The error codes that need a custom\
    \ plugin goal or state (UNKNOWN, TF_ERROR,\n  PATIENCE_EXCEEDED, FAILED_TO_MAKE_PROGRESS,\
    \ NO_VALID_CONTROL, CONTROLLER_TIMED_OUT,\n  START/GOAL_OCCUPIED, outside-map-bounds,\
    \ INVALID_PATH, SMOOTHED_PATH_IN_COLLISION,\n  FAILED_TO_SMOOTH_PATH). Each is\
    \ listed in readme.md with why the stock stack\n  cannot be made to emit it deterministically\
    \ in a single scenario trial.\n"
  agents:
  - id: turtlebot4
    configuration_files:
    - files/nav2_stack.launch.py
    - files/nav2_params.yaml
    derived_from: https://github.com/turtlebot/turtlebot4/tree/jazzy
    ros_distro: jazzy
  - id: simulation
    configuration_files:
    - world/nav2.yaml
    derived_from: https://github.com/cps-test-lab/roqsim
    ros_distro: jazzy
