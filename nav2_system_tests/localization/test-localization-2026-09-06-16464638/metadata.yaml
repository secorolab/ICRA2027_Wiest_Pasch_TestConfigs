scenario_file: scenario.osc
metadata:
  name: test_localization
  title: Nav2 localization initial-pose test with BT tracking, TurtleBot 4 + Nav2
  creators:
  - name: Wiest, Samuel
    identifiers: 0009-0002-9215-1238
  - name: Ortega Sainz, Argentina
    identifiers: 0000-0002-3873-4435
  - name: Pasch, Frederik
    identifiers: 0000-0002-2626-1538
  version: 1.0.0
  license: CC-BY-4.0
  keywords:
  - robotics
  - localization
  - navigation
  - ROS2
  - mujoco
  - roqsim
  - nav2
  - turtlebot4
  - behavior-tree
  description: 'Runtime blackbox port of nav2_system_tests/src/localization. The upstream
    test

    publishes an initial pose and checks that AMCL publishes a matching amcl_pose
    within

    0.25 m in x/y. The scenario framework has no generic topic-publish primitive,
    so

    robot.init_nav2(start_pose) provides the equivalent AMCL initialization, and a
    short

    navigation goal is added to produce behavior_tree_log events for BT tracking and

    coverage. Localization is graded from recorded amcl_pose/ground-truth data in
    the

    analysis notebook; navigation is only the BT-observation harness.

    '
  agents:
  - id: turtlebot4
    configuration_files:
    - files/nav2_stack.launch.py
    - files/nav2_params.yaml
    derived_from: https://github.com/turtlebot/turtlebot4/tree/jazzy
    ros_distro: jazzy
  - id: simulation
    configuration_files:
    - world/nav2.yaml
    derived_from: https://github.com/cps-test-lab/roqsim
    ros_distro: jazzy
