scenario_file: scenario.osc
metadata:
  name: test_drive_on_heading_behavior
  title: Nav2 drive-on-heading behavior server test, TurtleBot 4 + Nav2, in roqsim
    (MuJoCo)
  creators:
  - name: Wiest, Samuel
    identifiers: 0009-0002-9215-1238
  - name: Ortega Sainz, Argentina
    identifiers: 0000-0002-3873-4435
  - name: Pasch, Frederik
    identifiers: 0000-0002-2626-1538
  version: 1.0.0
  license: CC-BY-4.0
  keywords:
  - robotics
  - navigation
  - ROS2
  - mujoco
  - roqsim
  - nav2
  - turtlebot4
  - behavior
  - drive_on_heading
  description: 'Replication of nav2''s drive-on-heading behavior system test

    (nav2_system_tests/src/behaviors/drive_on_heading, main). Where upstream drives
    the

    /drive_on_heading action with a Python tester (drive_tester.py) against a tb3

    Gazebo world, this campaign runs the full nav2 stack (files/nav2_stack.launch.py,

    the same hexagon world as the sibling behavior, error_codes and system_failure

    campaigns) and drives /drive_on_heading with the generic action_call primitive.


    MEANING OF A CELL: one configuration is one upstream drive_on_heading parameterization

    (nav2_system_tests.csv lines 15-18, test case `test_drive_on_heading_behavior`).
    The

    drive behavior SUCCEEDS after reaching the target point for the valid-costmap
    case,

    and ABORTS for the costmap-dependent and impossible-command cases. The valid-costmap

    cell carries expect_success: true; the invalid-costmap, impossible-command and

    lethal-costmap cells carry expect_success: false. The analysis additionally verifies

    the upstream `error_code == 0` assertion on success and the specific error_code
    on

    abort from the recorded /drive_on_heading/_action timestamps (not expressible
    in the

    scenario; see drive_on_heading_behavior.osc header).


    PORTED CASE -> GOAL:

    - Invalid costmap  (CSV line 15) -> speed 0.15, target x 0.15, time_allowance
    5 s

    - Valid costmap    (CSV line 16) -> speed 0.15, target x 0.15, time_allowance
    5 s

    - Impossible command (CSV line 17) -> speed 0.15, target x 0.15, time_allowance
    0.1 s

    - Lethal costmap   (CSV line 18) -> speed 0.15, target x 0.15, time_allowance
    5 s


    NOT PORTED: the preempt-with-faster-command and cancel sub-cases inside the upstream

    valid-costmap test, and the manual costmap publishing used to trigger

    costmap-dependent failures. A mid-run preempt or cancel cannot be sequenced in
    this

    scenario framework (action_call has no preempt or cancel entry point --

    RosActionCall.shutdown() cancels only at scenario teardown), the framework has
    no

    mechanism to publish arbitrary costmaps to /local_costmap/costmap_raw before sending

    the goal, and the upstream "impossible target sign" check is one of several

    sub-assertions inside upstream''s imperative Test C that cannot be split into

    separately-graded scenario cells. Recorded, not faked, in readme.md.


    UPSTREAM ODDITY worth recording: upstream CMakeLists.txt sets

    BT_NAVIGATOR_XML=navigate_to_pose_w_replanning_and_behavior.xml, a file that exists

    neither in the navigation2 source tree nor in the installed nav2_bt_navigator
    share

    directory (verified in the robovast image). It is immaterial here -- /drive_on_heading

    is a behavior-server action, not a BT node -- but the CSV row''s BT column therefore

    names a file that cannot be loaded.

    '
  agents:
  - id: turtlebot4
    configuration_files:
    - files/nav2_stack.launch.py
    - files/nav2_params.yaml
    derived_from: https://github.com/turtlebot/turtlebot4/tree/jazzy
    ros_distro: jazzy
  - id: simulation
    configuration_files:
    - world/nav2.yaml
    derived_from: https://github.com/cps-test-lab/roqsim
    ros_distro: jazzy
