metadata:
  name: costmap_filter
  title: Metamorphic navigation sweep, TurtleBot 4 + Nav2, in roqsim (MuJoCo)
  creators:
  - name: Wiest, Samuel
    identifiers: 0009-0002-9215-1238
  - name: Ortega Sainz, Argentina
    identifiers: 0000-0002-3873-4435
  - name: Pasch, Frederik
    identifiers: 0000-0002-2626-1538
  version: 1.0.0
  license: CC-BY-4.0
  keywords:
  - robotics
  - navigation
  - ROS2
  - mujoco
  - roqsim
  - nav2
  - turtlebot4
  - metamorphic
  description: 'The metamorphic navigation sweep for new test cases using the nav2
    system tests as a base and varying syst. parameters.

    '
  agents:
  - id: turtlebot4
    configuration_files:
    - files/nav2_stack.launch.py
    - files/nav2_params.yaml
    derived_from: https://github.com/turtlebot/turtlebot4/tree/jazzy
    ros_distro: jazzy
  - id: simulation
    configuration_files:
    - world/nav2.yaml
    derived_from: https://github.com/cps-test-lab/roqsim
    ros_distro: jazzy
