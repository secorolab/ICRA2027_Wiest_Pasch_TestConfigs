scenario_file: scenario.osc
metadata:
  name: random_secorolab_nav_through_poses
  title: Truly random nav_to_pose configurations, TurtleBot 4 + Nav2, in roqsim (MuJoCo)
  creators:
  - name: Wiest, Samuel
    identifiers: 0009-0002-9215-1238
  version: 1.0.0
  license: CC-BY-4.0
  keywords:
  - robotics
  - navigation
  - ROS2
  - mujoco
  - roqsim
  - nav2
  - turtlebot4
  - random
  - nav_to_pose
  description: '120 truly random nav_to_pose configurations for secorolab. Each randomly
    picks: a PathVariationRandom start/goal pose, controller (50/50 MPPI/DWB), planner
    (use_astar True/False), static obstacle (50 %, random pose, fixed 0.5×0.5×1.0
    m), dynamic obstacle (50 %, random pose, fixed 0.5×0.5×1.0 m, spawned when the
    robot is within a random 0–5 m trigger distance of its pose).'
  agents:
  - id: turtlebot4
    configuration_files:
    - files/nav2_stack.launch.py
    - files/nav2_params.yaml
    derived_from: https://github.com/turtlebot/turtlebot4/tree/jazzy
    ros_distro: jazzy
  - id: simulation
    configuration_files:
    - world/nav2.yaml
    derived_from: https://github.com/cps-test-lab/roqsim
    ros_distro: jazzy
